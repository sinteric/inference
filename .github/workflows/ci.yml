name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CC: gcc
  CXX: g++
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc

jobs:
  rust-check:
    name: fmt clippy asset-free tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: apt (libstdc++ for tokenizers/esaxx-rs; cmake for static oneDNN)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++ cmake ninja-build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/sinteric-sdk/onednn-static-tp
          key: onednn-static-tp-3.13.4-${{ hashFiles('crates/onednn-sys/build.rs') }}
      - uses: Swatinem/rust-cache@v2
      - name: static oneDNN prefix
        run: echo "ONEDNN_STATIC_ROOT=$HOME/.cache/sinteric-sdk/onednn-static-tp" >> "$GITHUB_ENV"
      # The pinned nightly rustfmt; scripts/fmt.py names it (CLAUDE.md).
      - name: fmt
        run: python3 scripts/fmt.py --check
      - name: clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          # The OCR gate's ONNX Runtime reference (downloads ONNX Runtime).
          cargo clippy --locked -p drivers --features ort --all-targets -- -D warnings
      - name: asset-free tests (tests that need model files skip)
        run: cargo test --locked --workspace --lib --bins --tests -- --test-threads=4
      - name: noexecstack
        run: scripts/check-noexecstack.sh target/debug/eg2-onednn target/debug/ppocr-onednn
      - name: qualification skip (oracle is private)
        # Block scalar: an unquoted `run: ... print('...: ...')` is invalid YAML
        # (colon) and GitHub reports a 0s "workflow file issue" with no checks.
        run: |
          python3 -c "print('skip qualification: the OCR gate pages and EG2 corpus are private / absent')"
      - name: bench harness unit tests
        run: python3 -m unittest discover -s bench/tests -v
