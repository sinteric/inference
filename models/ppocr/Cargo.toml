[package]
name = "ppocr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pinned PP-OCR detector and Korean recognizer assets and model graphs."

[lints]
workspace = true

[features]
default = ["cli"]
cli = ["dep:png", "dep:zune-jpeg"]
debug-dumps = ["rt-onednn/debug-dumps"]

[dependencies]
png = { version = "=0.17.16", optional = true }
zune-jpeg = { version = "=0.5.15", optional = true }
rt-threads.workspace = true
rt-core.workspace = true
rt-image.workspace = true
rt-kernels.workspace = true
rt-assets.workspace = true
rt-onednn.workspace = true
rt-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
memmap2.workspace = true
safetensors.workspace = true

[dev-dependencies]
rt-threads.workspace = true

[[bin]]
name = "ppocr-onednn"
path = "src/bin/ppocr-onednn.rs"
required-features = ["cli"]
