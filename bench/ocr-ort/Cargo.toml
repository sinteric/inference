[package]
name = "ocr-ort"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ORT reference for the PP-OCR 100-page gate: ppocr pre/post-processing with ONNX Runtime networks."

[lints]
workspace = true

[dependencies]
ppocr.workspace = true
rt-core.workspace = true
rt-image.workspace = true
serde.workspace = true
serde_json.workspace = true
# ort 2.0.0-rc.13 bundles ONNX Runtime 1.28.0 (ort-sys dist.tsv ms@1.28.0).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }

[[bin]]
name = "ppocr-ort"
path = "src/main.rs"
