[package]
name = "serve-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Host-process simulation: an axum server that embeds the library's models, plus a load generator."

[lints]
workspace = true

[dependencies]
sinteric-inference = { path = "../../crates/sinteric-inference" }
# `cli` brings the PNG/JPEG decoder the gate drivers use.
ppocr = { workspace = true, features = ["cli"] }
rt-threads.workspace = true
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[[bin]]
name = "serve-sim"
path = "src/main.rs"
