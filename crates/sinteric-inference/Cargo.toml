[package]
name = "sinteric-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CPU inference for a few selected models on oneDNN: one Runtime, one API per model."
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["embeddinggemma2", "vela2", "ppocr"]
embeddinggemma2 = ["dep:embeddinggemma2"]
vela2 = ["dep:vela2-0p3b"]
ppocr = ["dep:ppocr"]

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
ppocr = { path = "../../models/ppocr", default-features = false, optional = true }
rt-core.workspace = true
rt-runtime.workspace = true
embeddinggemma2 = { workspace = true, optional = true }
vela2-0p3b = { workspace = true, optional = true }

[dev-dependencies]
rt-assets.workspace = true
anyhow.workspace = true

[[example]]
name = "embeddinggemma2"
path = "examples/embeddinggemma2.rs"
required-features = ["embeddinggemma2"]

[[example]]
name = "vela2"
path = "examples/vela2.rs"
required-features = ["vela2"]

[[example]]
name = "unload_rss"
path = "examples/unload_rss.rs"
required-features = ["embeddinggemma2", "vela2"]

[[example]]
name = "ocr"
path = "examples/ocr.rs"
required-features = ["ppocr"]

[[test]]
name = "ocr"
path = "tests/ocr.rs"
required-features = ["ppocr"]

[[test]]
name = "concurrent"
path = "tests/concurrent.rs"
required-features = ["embeddinggemma2", "vela2", "ppocr"]

[[test]]
name = "warmup"
path = "tests/warmup.rs"
required-features = ["embeddinggemma2"]

# Its own main: the test binary is also the worker binary it starts.
[[test]]
name = "worker"
path = "tests/worker.rs"
harness = false
required-features = ["embeddinggemma2", "vela2", "ppocr"]
