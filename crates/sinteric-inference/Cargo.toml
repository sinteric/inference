[package]
name = "sinteric-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A few selected models, each tuned for the hardware it runs on: EmbeddingGemma 2, PP-OCR and a prompt-injection guard on x86-64 CPUs through oneDNN."
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Writes intermediate tensors to disk while a model runs; for debugging a
# kernel against a reference only.
debug-dumps = []
# The PP-OCR steps around the networks (`ppocr::reference`), for the OCR
# gate's ONNX Runtime runner in tools/drivers. Not a supported API.
reference = []

[dependencies]
onednn-sys.workspace = true
hex.workspace = true
libc.workspace = true
memmap2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
toml.workspace = true

[dev-dependencies]
anyhow.workspace = true

[[example]]
name = "embeddinggemma2"
path = "examples/embeddinggemma2.rs"

[[example]]
name = "guard"
path = "examples/guard.rs"

[[example]]
name = "unload_rss"
path = "examples/unload_rss.rs"

[[example]]
name = "ocr"
path = "examples/ocr.rs"

[[example]]
name = "eg2_media_bench"
path = "examples/eg2_media_bench.rs"
