[workspace]
resolver = "2"
members = [
    "crates/onednn-sys",
    "crates/sinteric-inference",
    "tools/drivers",
    "tools/golden",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sinteric/inference"
# 1.99.1 fixes FFI build regressions in 1.99.0.
rust-version = "1.99.1"

[workspace.dependencies]
onednn-sys = { path = "crates/onednn-sys" }
sinteric-inference = { path = "crates/sinteric-inference" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# No `arbitrary_precision` here: a member inheriting this line hands it to every
# crate that links this library, because Cargo unifies features across a build.
# It changes how `serde_json::Number` serializes, so any non-JSON serializer in
# the caller (rhai's `to_dynamic`, CBOR) receives a private map instead of a
# number.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
memmap2 = "0.9"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
libc = "0.2"

[workspace.lints.rust]
# Every public type prints with `{:?}`, so a host can log what it holds.
missing_debug_implementations = "warn"
# Every public item says what it is for: this is a library, read through
# its rustdoc.
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
# An allowed lint says why the code is right as it stands.
allow_attributes_without_reason = "warn"
# A value the caller drops is a bug when computing it was the call's point,
# as a builder's `with_*` or a getter (STYLE.md, "`#[must_use]` on
# functions").
must_use_candidate = "warn"
return_self_not_must_use = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
# Release binaries carry no symbol table (decided 2026-10-18): keeps the single wide
# oneDNN build. Release has no debuginfo, so there is nothing to split; build with
# `debug = "line-tables-only"` + `split-debuginfo = "packed"` if symbolized crash
# reports are needed. Rust panic backtraces show no function names when stripped.
strip = "symbols"
