[workspace]
resolver = "2"
members = [
    "crates/rt-core",
    "crates/rt-threads",
    "crates/rt-assets",
    "crates/rt-text",
    "crates/rt-image",
    "crates/rt-kernels",
    "crates/rt-qual",
    "crates/onednn-sys",
    "crates/rt-backend",
    "crates/rt-onednn",
    "crates/rt-runtime",
    "crates/candle-mlas",
    "bench/vela-mlas",
    "bench/ocr-ort",
    "bench/serve-sim",
    "models/vela2-0p3b",
    "models/embeddinggemma2",
    "models/ppocr",
    "crates/sinteric-inference",
    "tools/golden",
]
# The default members exclude the research vela-mlas and candle-mlas crates, the
# ORT reference bench (bench/ocr-ort, downloads ONNX Runtime at build time) and
# the host-process simulation (bench/serve-sim, pulls in axum/tokio).
default-members = [
    "crates/rt-core",
    "crates/rt-threads",
    "crates/rt-assets",
    "crates/rt-text",
    "crates/rt-image",
    "crates/rt-kernels",
    "crates/rt-qual",
    "crates/onednn-sys",
    "crates/rt-backend",
    "crates/rt-onednn",
    "crates/rt-runtime",
    "models/vela2-0p3b",
    "models/embeddinggemma2",
    "models/ppocr",
    "crates/sinteric-inference",
    "tools/golden",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sinteric/inference"
# 1.99.1 fixes FFI build regressions in 1.99.0.
rust-version = "1.99.1"

[workspace.dependencies]
rt-core = { path = "crates/rt-core" }
rt-threads = { path = "crates/rt-threads" }
rt-assets = { path = "crates/rt-assets" }
rt-text = { path = "crates/rt-text" }
rt-image = { path = "crates/rt-image" }
rt-kernels = { path = "crates/rt-kernels" }
rt-qual = { path = "crates/rt-qual" }
onednn-sys = { path = "crates/onednn-sys" }
rt-backend = { path = "crates/rt-backend" }
rt-onednn = { path = "crates/rt-onednn" }
rt-runtime = { path = "crates/rt-runtime" }
candle-mlas = { path = "crates/candle-mlas" }
vela2-0p3b = { path = "models/vela2-0p3b" }
embeddinggemma2 = { path = "models/embeddinggemma2" }
ppocr = { path = "models/ppocr" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# No `arbitrary_precision` here: a member inheriting this line hands it to every
# crate that links this library, because Cargo unifies features across a build.
# It changes how `serde_json::Number` serializes, so any non-JSON serializer in
# the caller (rhai's `to_dynamic`, CBOR) receives a private map instead of a
# number. rt-text needs it for exact integer digits and asks for it itself;
# `vela2-0p3b` depends on rt-text, so its callers still get it.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
memmap2 = "0.9"
safetensors = "0.4"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
libc = "0.2"
once_cell = "1"
regex = "1"
fancy-regex = "=0.19.2"
unicode-segmentation = "1"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
libloading = "0.8"
bytemuck = "1"

[workspace.lints.clippy]
too_many_arguments = "allow"
uninlined_format_args = "allow"
needless_range_loop = "allow"
nonminimal_bool = "allow"
type_complexity = "allow"
excessive_precision = "allow"
manual_contains = "allow"
ptr_as_ptr = "allow"
explicit_counter_loop = "allow"
collapsible_if = "allow"
manual_range_contains = "allow"
useless_vec = "allow"
manual_is_multiple_of = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
# Release binaries carry no symbol table (decided 2026-10-18): keeps the single wide
# oneDNN build. Release has no debuginfo, so there is nothing to split; build with
# `debug = "line-tables-only"` + `split-debuginfo = "packed"` if symbolized crash
# reports are needed. Rust panic backtraces show no function names when stripped.
strip = "symbols"
